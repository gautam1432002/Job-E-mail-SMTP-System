# ============================================================
# render.yaml  — Infrastructure-as-Code for Render.com
# Defines: web service + PostgreSQL database
# Commit this file to your repo and import it on Render.
# ============================================================

services:
  # ── Django Web Service ────────────────────────────────────
  - type: web
    name: jobmailer-backend
    runtime: python
    rootDir: backend        # Render's working directory
    buildCommand: "./build.sh"
    startCommand: "gunicorn jobmailer.wsgi:application --workers 2 --log-file - --timeout 120 --bind 0.0.0.0:$PORT"
    plan: free              # upgrade to starter for no sleep
    healthCheckPath: /auth/login/
    envVars:
      - key: DJANGO_ENV
        value: prod
      - key: DJANGO_SETTINGS_MODULE
        value: jobmailer.settings
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"   # Add your custom domain if any
      - key: DATABASE_URL
        fromDatabase:
          name: jobmailer-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false           # You fill this in the Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false           # You fill this in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"

# ── PostgreSQL Database ───────────────────────────────────
databases:
  - name: jobmailer-db
    plan: free
    databaseName: jobmailer
    user: jobmailer_user
